plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenCentral()
}

loom {
    mods {
        "mkm" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API is itself a modular Fabric mod and its distribution JAR already
    // carries its API modules as nested mods. Embed the upstream distribution
    // as a nested dependency instead of asking users to install it separately.
    // Do NOT shade/copy Fabric API classes; Loader must resolve the module IDs.
    include(implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"))
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def mkmVersionForResources = project.version.toString()
processResources {
    inputs.property "version", mkmVersionForResources
    filesMatching("fabric.mod.json") {
        expand "version": mkmVersionForResources
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // Keep the required third-party notices with the distributed binary.
    from("third_party/FABRIC_API_LICENSE.txt") {
        into "META-INF/licenses/fabric-api"
        rename { "LICENSE.txt" }
    }
    from("third_party/THIRD_PARTY_NOTICES.txt") {
        into "META-INF"
    }
}
