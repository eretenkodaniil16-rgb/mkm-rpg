name: MNAE R07 articulated vertical export and Minecraft build
on:
  push:
    branches:
      - feature/mnae-r07-articulated-avatar-vertical
  pull_request:
    branches:
      - feature/mnae-p0-weapon-grip-render-contract
  workflow_dispatch:
permissions:
  contents: read

jobs:
  blender-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Get exactly the immutable approved R06 snapshot
        run: |
          git fetch --depth=1 origin refs/tags/mkm-guards-r06-approved:refs/tags/mkm-guards-r06-approved
          test "$(git rev-parse 'mkm-guards-r06-approved^{}')" = 5cae0c0dae1daf1bc7cfe07945af1fb67ea741b8
          mkdir -p build/r07
          git show mkm-guards-r06-approved:assets/animation/approved/mkm_sword_guards_r06/MKM_Three_Sword_Guards_R06.blend > build/r07/R06_APPROVED_READONLY.blend
          test -s build/r07/R06_APPROVED_READONLY.blend
      - name: Install Blender and framebuffer-only render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb libgl1
          blender --version | head -2
      - name: Export all 17 bones and render controlled nine-frame review
        run: |
          python3 -m py_compile tools/animation/r07/export_r07_blender.py
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b --factory-startup             --python tools/animation/r07/export_r07_blender.py --             --source-blend build/r07/R06_APPROVED_READONLY.blend             --out build/r07/derived --render
          test -s build/r07/derived/MKM_R07_Mid_Guard_Cut_Derived.blend
          test -s build/r07/derived/r07_mid_guard_cut_v3.json
          test "$(find build/r07/derived -name 'frame_*.png' -size +10k | wc -l)" -eq 9
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/r07/derived/r07_mid_guard_cut_v3.json').read_text())
          assert d['format']==3 and len(d['bones'])==17
          assert len(d['frames'])==43 and d['duration_ticks']==14
          assert next(e for e in d['markers'] if e['name']=='impact')['frame']==16
          assert d['qa']['min_head_proxy_clearance']>=0
          print('PASS: Blender R07 export, exact tick5 marker, 17 bones, 43 frames')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkm-r07-17bone-blender-source-export-nine-frames
          path: build/r07/derived/
          if-no-files-found: warn
          retention-days: 30

  minecraft-build:
    needs: blender-export
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/download-artifact@v4
        with:
          name: mkm-r07-17bone-blender-source-export-nine-frames
          path: build/r07/derived
      - name: Install generated Blender v3 runtime clip before Fabric build
        run: |
          mkdir -p src/main/resources/assets/mkm/mnae
          cp build/r07/derived/r07_mid_guard_cut_v3.json              src/main/resources/assets/mkm/mnae/r07_mid_guard_cut_v3.json
          python3 -m json.tool src/main/resources/assets/mkm/mnae/r07_mid_guard_cut_v3.json >/dev/null
      - name: Compile, test and package Fabric 26.3 + 17-bone asset
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
          test -n "$(find build/libs -name 'mkm-rpg-*.jar' -size +150k | head -1)"
      - name: Confirm exact resource and record checksum
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'mkm-rpg-*.jar' | grep -v sources | head -1)
          test -n "$JAR"
          unzip -l "$JAR" | grep -F assets/mkm/mnae/r07_mid_guard_cut_v3.json
          sha256sum "$JAR" | tee build/r07/derived/JAR_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mkm-r07-articulated-fabric26.3-test-jar
          path: build/libs/*jar
          if-no-files-found: error
          retention-days: 30
