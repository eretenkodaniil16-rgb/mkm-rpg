name: Build (Fabric 26.3, embedded API)
on:
  push:
    branches:
      - 'port/fabric-26.3'
      - 'feature/fabric-26.3-bundled-api'
      - 'feature/fabric-26.3-oneclick-installer'
      - 'fix/fabric-dodge-movement-sync'
      - 'fix/fabric-dodge-direction-input'
      - 'feature/action-combat-c2-state-hud'
      - 'feature/action-combat-c2-1-animations'
      - 'feature/animation-foundation-c3'
      - 'fix/c3-forward-roll-animation-qa'
      - 'feature/c3-2-animation-pacing-unarmed-combos'
      - 'feature/c3-3-continuous-motion-curves'
      - 'feature/c3-4-grounded-combat-stance'
  pull_request:
    branches:
      - 'port/fabric-26.3'
      - 'feature/fabric-26.3-bundled-api'
      - 'feature/fabric-26.3-oneclick-installer'
      - 'fix/fabric-dodge-movement-sync'
      - 'fix/fabric-dodge-direction-input'
      - 'feature/action-combat-c2-state-hud'
      - 'feature/action-combat-c2-1-animations'
      - 'feature/animation-foundation-c3'
      - 'fix/c3-forward-roll-animation-qa'
      - 'feature/c3-2-animation-pacing-unarmed-combos'
      - 'feature/c3-3-continuous-motion-curves'
      - 'feature/action-combat-v1'
      - 'foundation/project-bootstrap'
      - 'main'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Self-check animation choreography and generate storyboard
        run: python3 tools/animation/qa/forward_roll_selfcheck.py --out build/reports/animation-qa
      - name: Self-check six attacks against authoritative hit ticks
        run: python3 tools/animation/qa/attack_timing_selfcheck.py --out build/reports/animation-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkm-c3-animation-qa-report
          path: build/reports/animation-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify the release JAR embeds a complete Fabric API distribution
        run: |
          python3 - <<'PY'
          import glob
          import io
          import json
          import os
          import zipfile

          paths = [
              p for p in glob.glob("build/libs/*.jar")
              if p.endswith("0.0.5-fabric.2.jar")
          ]
          assert len(paths) == 1, f"Expected exactly one release JAR, got {paths}"
          path = paths[0]
          with zipfile.ZipFile(path) as mod:
              meta = json.loads(mod.read("fabric.mod.json"))
              assert meta["id"] == "mkm"
              assert "fabric-api" in meta.get("depends", {})
              nested = [j["file"] for j in meta.get("jars", [])]
              assert nested, "MKM contains no nested jars"
              api_distributions = []
              for inner_path in nested:
                  inner = mod.read(inner_path)
                  with zipfile.ZipFile(io.BytesIO(inner)) as dep:
                      dep_meta = json.loads(dep.read("fabric.mod.json"))
                      if dep_meta.get("id") == "fabric-api":
                          api_distributions.append(dep_meta)
              assert len(api_distributions) == 1, "Expected exactly one embedded fabric-api distribution"
              assert api_distributions[0].get("jars"), "Bundled Fabric API has no module jars"
              print(f"PASS: {os.path.basename(path)} embeds Fabric API with {len(api_distributions[0]['jars'])} nested modules")
          PY
      - name: Smoke-test dedicated server startup
        shell: bash
        run: |
          mkdir -p run
          echo eula=true > run/eula.txt
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from pathlib import Path

          log_path = Path("server-smoke.log")
          with log_path.open("w", encoding="utf-8") as output:
              process = subprocess.Popen(
                  ["./gradlew", "runServer", "--no-daemon"],
                  stdout=output, stderr=subprocess.STDOUT,
                  start_new_session=True)
              initialized = False
              ready = False
              try:
                  for i in range(100):
                      time.sleep(1)
                      text = log_path.read_text(encoding="utf-8", errors="replace")
                      initialized = "MKM Fabric 26.3 initialized" in text
                      ready = "Done (" in text and 'For help, type "help"' in text
                      if initialized and ready:
                          print("PASS: MKM loaded and dedicated server reached ready state.", flush=True)
                          break
                      if process.poll() is not None:
                          break
                  if not (initialized and ready):
                      print("FAIL: server did not initialize and reach ready state.", flush=True)
                      print(log_path.read_text(encoding="utf-8", errors="replace")[-15000:], flush=True)
                      raise SystemExit(1)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
          PY
      - name: Smoke-test client startup under virtual display
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from pathlib import Path

          log_path = Path("client-smoke.log")
          environment = dict(os.environ, LIBGL_ALWAYS_SOFTWARE="1")
          with log_path.open("w", encoding="utf-8") as output:
              process = subprocess.Popen(
                  ["xvfb-run", "-a", "./gradlew", "runClient", "--no-daemon"],
                  stdout=output, stderr=subprocess.STDOUT, env=environment,
                  start_new_session=True)
              initialized_at = None
              try:
                  for i in range(115):
                      time.sleep(1)
                      logs = log_path.read_text(encoding="utf-8", errors="replace")
                      if "MKM Fabric 26.3 initialized" in logs and initialized_at is None:
                          initialized_at = i
                      if process.poll() is not None:
                          raise RuntimeError(f"Client exited early (code {process.returncode})")
                      if initialized_at is not None and i - initialized_at >= 22:
                          fatal = ("MixinApplyError", "Mixin apply failed",
                                   "Could not execute entrypoint", "Game crashed!",
                                   "Crash report saved to")
                          if any(message in logs for message in fatal):
                              raise RuntimeError("Fatal client mixin or initialization message")
                          print("PASS: C2.1 client initialized and remained alive under Xvfb.", flush=True)
                          break
                  else:
                      raise RuntimeError("Client did not initialize and stay alive before timeout")
              except Exception:
                  print(log_path.read_text(encoding="utf-8", errors="replace")[-19000:], flush=True)
                  raise
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
          PY
      - name: Validate Windows PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "distribution/windows/Install_MKM.ps1").Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "PowerShell installer syntax: OK"
      - name: Package one-click Windows installer
        run: python3 distribution/windows/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mkm-fabric-26.3-one-jar
          path: build/libs/mkm-rpg-0.0.5-fabric.2.jar
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: mkm-fabric-26.3-oneclick-windows
          path: dist/MKM_Fabric_26.3_Installer_Windows.zip
          if-no-files-found: error
          retention-days: 14
