name: Build (Fabric 26.3)
on:
  push:
    branches:
      - 'port/fabric-26.3'
  pull_request:
    branches:
      - 'feature/action-combat-v1'
      - 'foundation/project-bootstrap'
      - 'main'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mkm-fabric-26.3
          path: build/libs/mkm-rpg-*.jar
          retention-days: 14
