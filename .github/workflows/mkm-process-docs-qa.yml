name: MKM Process Docs QA

on:
  push:
    branches:
      - docs/mkm-unified-workflow-v1
    paths:
      - "docs/workflow/**"
      - "AGENTS.md"
      - ".agents/skills/mkm-engineering-workflow/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "tools/workflow/**"
      - ".github/workflows/mkm-process-docs-qa.yml"
  pull_request:
    paths:
      - "docs/workflow/**"
      - "AGENTS.md"
      - ".agents/skills/mkm-engineering-workflow/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "tools/workflow/**"
      - ".github/workflows/mkm-process-docs-qa.yml"

permissions:
  contents: read

jobs:
  workflow-document-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile process-check script
        run: python -m py_compile tools/workflow/check_mkm_workflow.py
      - name: Verify seven-stage docs, agent guidance and PR template
        run: python tools/workflow/check_mkm_workflow.py
