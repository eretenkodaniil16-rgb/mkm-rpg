name: MKM Environment Actual Minecraft F2 Capture
on:
  push:
    branches:
      - 'feature/environment-showcase-qa5-issue79'
  workflow_dispatch:

jobs:
  actual-minecraft-f2:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install X11 keystroke control for real Minecraft
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdotool xvfb
      - name: Generate disposable test world, quick play Minecraft and press real F2
        env:
          CI: 'true'
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" \
            python3 tools/environment/capture_showcase_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkm-environment-actual-minecraft-f2
          path: |
            build/reports/environment-showcase/*.png
            environment-server-smoke.log
            environment-client-capture.log
          if-no-files-found: warn
          retention-days: 14
