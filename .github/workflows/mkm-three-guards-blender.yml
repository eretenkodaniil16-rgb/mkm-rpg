name: MKM Three Guards Blender Study

on:
  push:
    branches: [tools/three-guards-blender-source-v1]
    paths:
      - tools/animation/pilots/guard_studies/**
      - .github/workflows/mkm-three-guards-blender.yml
  pull_request:
    paths:
      - tools/animation/pilots/guard_studies/**
      - .github/workflows/mkm-three-guards-blender.yml

permissions:
  contents: read

jobs:
  authoring-three-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and check source pose manifest
        run: |
          python -m py_compile tools/animation/pilots/guard_studies/blender_three_guards.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tools/animation/pilots/guard_studies/first_three_stances_v1.json').read_text())
          assert len(x['stances'])==3
          assert [s['index'] for s in x['stances']]==[1,2,3]
          assert x['weapon_binding']['binding']=='fixed_hand_bone_local_transform'
          assert x['acceptance']['images_required']==9
          PY
      - name: Install Blender and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender xvfb
          blender --version | head -3
      - name: Render all guards from one armature in one Blender file
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a blender -b --factory-startup --python tools/animation/pilots/guard_studies/blender_three_guards.py -- --render --out build/reports/three-guards
          test -s build/reports/three-guards/MKM_Three_Sword_Guards_v1.blend
          test -s build/reports/three-guards/manifest.json
          test "$(find build/reports/three-guards -name 'stance_*.png' -size +2k | wc -l)" -eq 9
      - name: Geometry preflight summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/reports/three-guards/manifest.json').read_text())
          assert x['authoring_only'] and x['rendered_images']==9
          assert len(x['poses'])==3 and x['rig_bone_count']==17
          for p in x['poses']:
              print(p['id'], 'knee',p['knee_flexion_deg'], 'wrist',p['wrist_ik_error'],'sword',p['sword_axis_dot'], 'checks',p['checks'])
          assert all(p['checks']['wrist_reached'] and p['checks']['sword_follows_hand'] for p in x['poses']), 'Critical hand/grip coupling failed'
          print('Blender geometry generated. Knee angles / visuals REQUIRE separate review.')
          PY
      - name: Upload Blender source and nine genuine views
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkm-three-guards-blender-one-rig-nine-views
          path: build/reports/three-guards/
          if-no-files-found: warn
          retention-days: 14
